[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctqa-catphan"
version = "0.2.1"
description = "Python port of CatPhan CT morning QA (CTQA-CatPhan)"
requires-python = ">=3.10"
dependencies = [
    "SimpleITK>=2.3",
    "numpy",
    "pydicom",
    "watchdog",
    "PyQt5",
]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PyQt5"]
build = ["pyinstaller>=6", "build"]

[project.scripts]
ctqa-catphan = "ctqa_catphan.cli:main"

[tool.setuptools.packages.find]
include = ["ctqa_catphan*"]

[tool.setuptools.package-data]
ctqa_catphan = ["etx_params/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
